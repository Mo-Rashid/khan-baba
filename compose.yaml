services:
  mongodb:
    image: mongo:7
    container_name: khan-baba-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - khan-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khan-baba-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    networks:
      - khan-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://15.252.164.236:5000"
        VITE_API_BASE: "http://15.252.164.236:5000/api/labs"
    container_name: khan-baba-frontend
    restart: unless-stopped
    ports:
      - "80:80"
     
    depends_on:
      - backend
    networks:
      - khan-network

volumes:
  mongodb_data:

networks:
  khan-network:
    driver: bridge
