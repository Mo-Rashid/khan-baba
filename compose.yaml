services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: khan-baba-backend

    restart: unless-stopped

    env_file:
      - ./backend/.env

    expose:
      - "5000"

    networks:
      - khan-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""

    container_name: khan-baba-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - khan-network


networks:
  khan-network:
    driver: bridge